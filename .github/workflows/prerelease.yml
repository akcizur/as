name: Build Godot Pre-release

on:
  push:
    tags:
      - "v*-alpha*"
      - "v*-beta*"
      - "v*-rc*"
      - "v*-pre*"
  workflow_dispatch:
    inputs:
      tag_name:
        description: "Pre-release tag to create (for example v2.4.0-beta.1)"
        required: true
        type: string
      target_commitish:
        description: "Branch or commit to build"
        required: true
        default: "main"
        type: string

permissions:
  contents: write

concurrency:
  group: prerelease-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Resolve release tag
        id: release
        shell: bash
        run: |
          if [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" ]]; then
            tag="${{ inputs.tag_name }}"
            target="${{ inputs.target_commitish }}"
          else
            tag="${GITHUB_REF_NAME}"
            target="${GITHUB_SHA}"
          fi
          if [[ ! "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+-(alpha|beta|rc|pre)([.-][0-9A-Za-z.-]+)?$ ]]; then
            echo "Expected a pre-release tag such as v2.4.0-beta.1, got: $tag" >&2
            exit 1
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "target=$target" >> "$GITHUB_OUTPUT"

      - name: Checkout source
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.release.outputs.target }}

      - name: Install Godot 4.6.1 and Web export templates
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.6.1
          use-dotnet: false
          include-templates: true

      - name: Verify engine
        run: godot --version

      - name: Import project assets
        run: godot --headless --editor --path godot --quit

      - name: Smoke-test runtime
        shell: bash
        run: |
          set -o pipefail
          godot --headless --path godot --quit-after 8 2>&1 | tee /tmp/prerelease-smoke.log
          if grep -E "SCRIPT ERROR|Parse Error|Failed to load script" /tmp/prerelease-smoke.log; then
            echo "Godot runtime smoke test reported a script error." >&2
            exit 1
          fi

      - name: Assert core gameplay runtime
        shell: bash
        run: |
          set -o pipefail
          godot --headless --path godot --script res://scripts/runtime_smoke_test.gd 2>&1 | tee /tmp/gameplay-runtime-test.log
          grep -q "GAMEPLAY_RUNTIME_TEST_BEGIN" /tmp/gameplay-runtime-test.log
          grep -q "GAMEPLAY_RUNTIME_TEST_END" /tmp/gameplay-runtime-test.log

      - name: Build clean Web export
        run: node scripts/build-web.mjs

      - name: Verify export payload
        shell: bash
        run: |
          test -s dist/index.html
          test -n "$(find dist -maxdepth 1 -type f -name '*.wasm' -print -quit)"
          test -n "$(find dist -maxdepth 1 -type f -name '*.pck' -print -quit)"
          touch dist/.nojekyll
          ls -lh dist

      - name: Package browser build
        shell: bash
        run: |
          mkdir -p release
          zip -9 -r "release/openworld-simulation-${{ steps.release.outputs.tag }}-web.zip" dist
          sha256sum release/*.zip > release/SHA256SUMS.txt

      - name: Publish GitHub pre-release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          tag="${{ steps.release.outputs.tag }}"
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" release/*.zip release/SHA256SUMS.txt --clobber
          else
            gh release create "$tag" release/*.zip release/SHA256SUMS.txt \
              --target "${{ steps.release.outputs.target }}" \
              --prerelease \
              --title "Openworld Simulation $tag" \
              --generate-notes
          fi
